name: Test-CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@latest
        env:
          PYTHON: ""
      - uses: julia-actions/julia-runtest@latest
        env:
          PYTHON: ""
          JULIA_NUM_THREADS: "2"
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          # Codecov's ingest service still indexes this repo under the pre-rename
          # owner; Sienna-Platform/... returns 404 while NREL-Sienna/... returns 202.
          # Revert to ${{ github.repository }} once the Codecov org is resynced.
          slug: NREL-Sienna/PowerNetworkMatrices.jl
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
