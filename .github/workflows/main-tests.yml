name: Main - CI

on:
  schedule:
  - cron: "0 0 * * 1-5"
  push:
    branches:
      - main

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1', 'nightly']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@latest
        env:
          PYTHON: ""
      - uses: julia-actions/julia-runtest@latest
        continue-on-error: ${{ matrix.julia-version == 'nightly' }}
        env:
          PYTHON: ""
          JULIA_NUM_THREADS: "2"
      # Coverage is reported from a single job: the matrix would otherwise submit
      # multiple reports per commit, and the Windows one carries backslash paths
      # Codecov cannot match against the repo tree.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
