# PSY's own [sources] pins for these are ignored once PSY is a dependency rather than the
# root project, so PNM needs its own pins for every unregistered OpenAPI package PSY depends
# on. A `[sources]` entry is only honored when the package is also in `[deps]` — an `[extras]`
# entry passes validation but the pin is dropped during resolution.
# PowerDynamics-/PowerInvestmentsOpenAPIModels are not imported here — they are deps of the
# PowerOpenAPIModels umbrella, and [sources] are not inherited transitively, so this env must
# pin them itself. rev must track PowerSystems' own pin (currently jd/market_components) or PSY
# resolves against a stale OpenAPI tree.
PowerCoreOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerCoreOpenAPIModels.jl"}
PowerDynamicsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerDynamicsOpenAPIModels.jl"}
PowerInvestmentsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerInvestmentsOpenAPIModels.jl"}
PowerOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerOperationsOpenAPIModels.jl"}
PowerTimeSeriesOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "jd/market_components", subdir = "PowerTimeSeriesOpenAPIModels.jl"}

